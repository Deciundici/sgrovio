<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Area Professionista | Sgrovio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#17231c}header{background:#fff;border-bottom:1px solid #ddd;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.container{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:16px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,.06)}input{width:100%;padding:14px;margin:7px 0 15px;border:1px solid #ccc;border-radius:9px;font-size:16px}button,.contact{border:0;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}.primary{background:#173f2c;color:#fff}.accept{background:#19733c;color:#fff}.reject{background:#eee;color:#8b1e1e;margin-left:8px}.logout{background:transparent;border:1px solid #ccc}.score{display:inline-block;background:#e5f5e9;color:#176735;padding:7px 12px;border-radius:30px;font-weight:bold}.muted{color:#68736c}.error{color:#a40000;margin-top:12px}#dashboard{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff;border:1px solid #d9d9d2;color:#17231c}.tab.active{background:#17231c;color:#fff}.contactBox{margin-top:18px;padding:16px;background:#f1f7f3;border-radius:12px}.contactBox p{margin:8px 0}.contact{background:#173f2c;color:#fff;margin:8px 7px 0 0}.empty{text-align:center;color:#68736c;padding:30px}.badge{font-size:12px;background:#eee;border-radius:20px;padding:4px 8px;margin-left:5px}
</style></head><body>
<header><div class="logo">Sgrovio</div><button id="logoutBtn" class="logout" style="display:none">Esci</button></header>
<div class="container">
<section id="login" class="card"><h1>Area Professionista</h1><p class="muted">Accedi per visualizzare le richieste compatibili con la tua attività.</p><label>Email</label><input id="email" type="email" placeholder="nome@azienda.it"><label>Password</label><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary">Accedi</button><div id="loginMessage" class="error"></div></section>
<section id="dashboard"><div class="card"><h1 id="welcome">Dashboard</h1><p class="muted">Gestisci qui le richieste che Sgrovio ha associato alla tua attività.</p><div class="tabs"><button class="tab active" data-filter="proposto">Nuove <span id="count-proposto" class="badge">0</span></button><button class="tab" data-filter="accettato">Accettate <span id="count-accettato" class="badge">0</span></button><button class="tab" data-filter="rifiutato">Rifiutate <span id="count-rifiutato" class="badge">0</span></button><button class="tab" data-filter="tutte">Tutte <span id="count-tutte" class="badge">0</span></button></div></div><div id="requests"></div></section>
</div>
<script>
const SUPABASE_URL='https://nijsfyysxvqogjjfawrc.supabase.co';
const SUPABASE_KEY='sb_publishable_YBMEKwWJCtTZsiRBS45hGQ_sDogz1SE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginSection=document.getElementById('login'),dashboard=document.getElementById('dashboard'),logoutBtn=document.getElementById('logoutBtn'),requests=document.getElementById('requests'),loginMessage=document.getElementById('loginMessage');
let allRequests=[],currentFilter='proposto';
document.getElementById('loginBtn').onclick=login;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRequests();});
logoutBtn.onclick=async()=>{await db.auth.signOut();showLogin();};
async function login(){loginMessage.textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{error}=await db.auth.signInWithPassword({email,password});if(error){loginMessage.textContent='Accesso non riuscito: '+error.message;return}await startDashboard()}
async function startDashboard(){const{data:{user}}=await db.auth.getUser();if(!user){showLogin();return}const{data:professionista,error}=await db.from('professionisti').select('id,nome,email').eq('user_id',user.id).single();if(error||!professionista){await db.auth.signOut();showLogin(false);loginMessage.textContent=error?'Errore database: '+error.message:'Questo account non è collegato a un professionista Sgrovio.';return}loginSection.style.display='none';dashboard.style.display='block';logoutBtn.style.display='block';document.getElementById('welcome').textContent='Ciao, '+professionista.nome;await loadRequests()}
async function loadRequests(){requests.innerHTML='<div class="card">Caricamento richieste...</div>';const{data,error}=await db.from('richieste_professionista').select('*').order('created_at',{ascending:false});if(error){requests.innerHTML='<div class="card error">Errore: '+escapeHtml(error.message)+'</div>';return}allRequests=data||[];updateCounts();renderRequests()}
function updateCounts(){['proposto','accettato','rifiutato'].forEach(s=>document.getElementById('count-'+s).textContent=allRequests.filter(x=>x.stato===s).length);document.getElementById('count-tutte').textContent=allRequests.length}
function renderRequests(){const data=currentFilter==='tutte'?allRequests:allRequests.filter(x=>x.stato===currentFilter);if(!data.length){requests.innerHTML='<div class="card empty">Nessuna richiesta in questa sezione.</div>';return}requests.innerHTML='';data.forEach(match=>{const card=document.createElement('div');card.className='card';const accepted=match.stato==='accettato';const tel=String(match.telefono||'').replace(/[^0-9+]/g,'');const email=String(match.email||'');const contacts=accepted?`<div class="contactBox"><strong>Contatti cliente</strong><p><strong>Nome:</strong> ${escapeHtml(match.nome_cliente||'Non indicato')}</p><p><strong>Email:</strong> ${escapeHtml(email||'Non indicata')}</p><p><strong>Telefono:</strong> ${escapeHtml(match.telefono||'Non indicato')}</p>${tel?`<a class="contact" href="tel:${escapeHtml(tel)}">Chiama</a><a class="contact" target="_blank" rel="noopener" href="https://wa.me/${escapeHtml(tel.replace(/^\+/,'').replace(/\s/g,''))}">WhatsApp</a>`:''}${email?`<a class="contact" href="mailto:${escapeHtml(email)}">Email</a>`:''}</div>`:'';card.innerHTML=`<span class="score">Compatibilità ${escapeHtml(match.punteggio||0)}%</span><h2>${escapeHtml(match.categoria||'Richiesta')}</h2><p><strong>Zona:</strong> ${escapeHtml(match.comune||'')} ${match.cap?'('+escapeHtml(match.cap)+')':''}</p><p><strong>Descrizione:</strong><br>${escapeHtml(match.descrizione||'')}</p><p><strong>Urgenza:</strong> ${escapeHtml(match.urgenza||'Non indicata')}</p><p><strong>Budget:</strong> ${escapeHtml(match.budget||'Non indicato')}</p><p><strong>Stato:</strong> ${escapeHtml(match.stato||'')}</p>${contacts}${match.stato==='proposto'?`<div style="margin-top:16px"><button class="accept" onclick="respond('${match.matching_id}','accettato')">ACCETTA</button><button class="reject" onclick="respond('${match.matching_id}','rifiutato')">RIFIUTA</button></div>`:''}`;requests.appendChild(card)})}
async function respond(matchId,stato){if(!confirm(stato==='accettato'?'Vuoi accettare questa richiesta?':'Vuoi rifiutare questa richiesta?'))return;const{error}=await db.from('matching').update({stato,responded_at:new Date().toISOString()}).eq('id',matchId);if(error){alert('Errore: '+error.message);return}currentFilter=stato;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===currentFilter));await loadRequests()}
function showLogin(clear=true){dashboard.style.display='none';logoutBtn.style.display='none';loginSection.style.display='block';if(clear)loginMessage.textContent=''}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
(async()=>{const{data:{session}}=await db.auth.getSession();if(session)await startDashboard()})();
</script></body></html>
