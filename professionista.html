<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Area Professionista | Sgrovio</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f0;
      color: #17231c;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0 15px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #173f2c;
      color: white;
    }

    .accept {
      background: #19733c;
      color: white;
    }

    .reject {
      background: #eee;
      color: #8b1e1e;
      margin-left: 8px;
    }

    .logout {
      background: transparent;
      border: 1px solid #ccc;
    }

    .score {
      display: inline-block;
      background: #e5f5e9;
      color: #176735;
      padding: 7px 12px;
      border-radius: 30px;
      font-weight: bold;
    }

    .status {
      font-weight: bold;
      text-transform: capitalize;
    }

    .muted {
      color: #68736c;
    }

    .error {
      color: #a40000;
      margin-top: 12px;
    }

    #dashboard {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Sgrovio</div>
  <button id="logoutBtn" class="logout" style="display:none">
    Esci
  </button>
</header>

<div class="container">

  <section id="login" class="card">
    <h1>Area Professionista</h1>
    <p class="muted">
      Accedi per visualizzare le richieste compatibili con la tua attività.
    </p>

    <label>Email</label>
    <input id="email" type="email" placeholder="nome@azienda.it">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn" class="primary">
      Accedi
    </button>

    <div id="loginMessage" class="error"></div>
  </section>

  <section id="dashboard">

    <div class="card">
      <h1 id="welcome">Dashboard</h1>
      <p class="muted">
        Qui trovi le richieste che Sgrovio ha associato alla tua attività.
      </p>
    </div>

    <div id="requests"></div>

  </section>

</div>

<script>
const SUPABASE_URL =
  'https://nijsfyysxvqogjjfawrc.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_YBMEKwWJCtTZsiRBS45hGQ_sDogz1SE';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById('login');
const dashboard = document.getElementById('dashboard');
const logoutBtn = document.getElementById('logoutBtn');
const requests = document.getElementById('requests');
const loginMessage = document.getElementById('loginMessage');

document.getElementById('loginBtn').onclick = login;

logoutBtn.onclick = async () => {
  await db.auth.signOut();
  showLogin();
};

async function login() {

  loginMessage.textContent = '';

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const { error } =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    loginMessage.textContent =
      'Accesso non riuscito: ' + error.message;
    return;
  }

  await startDashboard();
}

async function startDashboard() {

  const {
    data: { user }
  } = await db.auth.getUser();

  if (!user) {
    showLogin();
    return;
  }

  const { data: professionista, error } =
    await db
      .from('professionisti')
      .select('id,nome,email')
      .eq('user_id', user.id)
      .single();

  if (error) {
  console.error('ERRORE PROFESSIONISTA:', error);

  await db.auth.signOut();

  loginMessage.textContent =
    'Errore database: ' + error.message;

  showLogin();
  return;
}

if (!professionista) {
  await db.auth.signOut();

  loginMessage.textContent =
    'Questo account non è collegato a un professionista Sgrovio.';

  showLogin();
  return;
}
  

  loginSection.style.display = 'none';
  dashboard.style.display = 'block';
  logoutBtn.style.display = 'block';

  document.getElementById('welcome').textContent =
    'Ciao, ' + professionista.nome;

  await loadRequests(professionista.id);
}

async function loadRequests(professionistaId) {

  requests.innerHTML =
    '<div class="card">Caricamento richieste...</div>';

  const { data, error } =
    await db
      .from('matching')
      .select(`
        id,
        punteggio,
        stato,
        responded_at,
        richiesta_id,
        richieste (
          nome_cliente,
          categoria,
          descrizione,
          comune,
          cap,
          provincia,
          urgenza,
          budget
        )
      `)
      .eq('professionista_id', professionistaId)
      .order('created_at', { ascending: false });

  if (error) {
    requests.innerHTML =
      '<div class="card error">Errore: ' +
      error.message +
      '</div>';
    return;
  }

  if (!data || data.length === 0) {
    requests.innerHTML =
      '<div class="card">Nessuna richiesta disponibile al momento.</div>';
    return;
  }

  requests.innerHTML = '';

  data.forEach(match => {

    const r = match.richieste || {};

    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <span class="score">
        Compatibilità ${match.punteggio}%
      </span>

      <h2>${escapeHtml(r.categoria || 'Richiesta')}</h2>

      <p>
        <strong>Zona:</strong>
        ${escapeHtml(r.comune || '-')}
        ${r.cap ? '(' + escapeHtml(r.cap) + ')' : ''}
      </p>

      <p>
        <strong>Descrizione:</strong><br>
        ${escapeHtml(r.descrizione || '-')}
      </p>

      <p>
        <strong>Urgenza:</strong>
        ${escapeHtml(r.urgenza || '-')}
      </p>

      <p>
        <strong>Budget:</strong>
        ${escapeHtml(r.budget || 'Non indicato')}
      </p>

      <p>
        <strong>Stato:</strong>
        <span class="status">
          ${escapeHtml(match.stato)}
        </span>
      </p>

      ${
        match.stato === 'proposto'
        ? `
          <button
            class="accept"
            onclick="respond('${match.id}','accettato')">
            ACCETTA
          </button>

          <button
            class="reject"
            onclick="respond('${match.id}','rifiutato')">
            RIFIUTA
          </button>
        `
        : ''
      }
    `;

    requests.appendChild(card);
  });
}

async function respond(matchId, stato) {

  const conferma = confirm(
    stato === 'accettato'
      ? 'Vuoi accettare questa richiesta?'
      : 'Vuoi rifiutare questa richiesta?'
  );

  if (!conferma) return;

  const { error } =
    await db
      .from('matching')
      .update({
        stato,
        responded_at: new Date().toISOString()
      })
      .eq('id', matchId);

  if (error) {
    alert('Errore: ' + error.message);
    return;
  }

  await startDashboard();
}

function showLogin(clearMessage = true) {

  dashboard.style.display = 'none';
  logoutBtn.style.display = 'none';
  loginSection.style.display = 'block';

  if (clearMessage)
    loginMessage.textContent = '';
}

function escapeHtml(value) {

  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

(async () => {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session)
    await startDashboard();

})();
</script>

</body>
</html>
