<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area Cliente | Sgrovio</title>
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "212e7d7c3e5a4350bbaaee1e0391d14d"}'></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f7f5f0;color:#171717}header{background:#fff;border-bottom:1px solid #e4dfd6;padding:20px}.nav{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;text-decoration:none;color:#171717}.home{color:#171717;text-decoration:none;font-weight:700}.wrap{max-width:620px;margin:55px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4dfd6;border-radius:18px;padding:28px;box-shadow:0 5px 20px rgba(0,0,0,.04)}h1{margin-top:0}.muted{color:#686868;line-height:1.5}label{display:block;font-weight:700;margin-top:14px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font:inherit;margin-top:7px}button{padding:13px 18px;border:0;border-radius:10px;background:#171717;color:#fff;font-weight:800;cursor:pointer;margin-top:16px}.secondary{background:#fff;color:#171717;border:1px solid #bbb;margin-left:8px}.message{margin-top:14px;color:#9b1c1c}.ok{color:#176735}.account{background:#edf8f0;border:1px solid #c8e3d0;border-radius:14px;padding:18px;margin-top:18px}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="./">Sgrovio</a><a class="home" href="./">Home</a></div></header>
<main class="wrap">
  <section class="card">
    <div id="loginView">
      <h1>Area Cliente</h1>
      <p class="muted">Accedi con email e password del tuo account Sgrovio. In questa prima fase verifichiamo soltanto l’accesso in modo sicuro.</p>
      <label>Email<input id="email" type="email" autocomplete="email" placeholder="nome@email.it"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label>
      <button id="loginBtn">Accedi</button>
      <p id="message" class="message"></p>
    </div>
    <div id="accountView" style="display:none">
      <h1>Area Cliente</h1>
      <div class="account"><strong>Accesso effettuato ✓</strong><p id="accountEmail" class="muted"></p></div>
      <p class="muted">Il login funziona. Nel prossimo passaggio collegheremo a questo account soltanto le sue richieste.</p>
      <button id="logoutBtn" class="secondary">Esci</button>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cliente.js"></script>
</body>
</html>
