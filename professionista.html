<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Area Professionista | Sgrovio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f5f0;color:#17231c}header{background:#fff;border-bottom:1px solid #ddd;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:800}.container{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:16px;margin-bottom:20px;box-shadow:0 5px 20px rgba(0,0,0,.06)}input{width:100%;padding:14px;margin:7px 0 15px;border:1px solid #ccc;border-radius:9px;font-size:16px}button,.contact{border:0;border-radius:9px;padding:13px 18px;cursor:pointer;font-weight:bold;text-decoration:none;display:inline-block}.primary{background:#173f2c;color:#fff}.accept{background:#19733c;color:#fff}.reject{background:#eee;color:#8b1e1e;margin-left:8px}.complete{background:#264b8f;color:#fff;margin-top:12px}.logout{background:transparent;border:1px solid #ccc}.score{display:inline-block;background:#e5f5e9;color:#176735;padding:7px 12px;border-radius:30px;font-weight:bold}.muted{color:#68736c}.error{color:#a40000;margin-top:12px}#dashboard{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff;border:1px solid #d9d9d2;color:#17231c}.tab.active{background:#17231c;color:#fff}.contactBox{margin-top:18px;padding:16px;background:#f1f7f3;border-radius:12px}.contactBox p{margin:8px 0}.contact{background:#173f2c;color:#fff;margin:8px 7px 0 0}.empty{text-align:center;color:#68736c;padding:30px}.badge{font-size:12px;background:#eee;border-radius:20px;padding:4px 8px;margin-left:5px}.done{display:inline-block;background:#e8eefb;color:#264b8f;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.waiting{display:inline-block;background:#fff7df;color:#7a5a00;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.problem{display:inline-block;background:#fff0f0;color:#8b1e1e;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.assigned{display:inline-block;background:#f0f0f0;color:#626262;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.ratingBox{margin:16px 0 4px;padding:16px;border-radius:12px;background:#fff8e7;border:1px solid #ead8a1}.stars{font-size:22px;color:#9a6b00;letter-spacing:1px}.reviewItem{margin-top:10px;padding-top:10px;border-top:1px solid #ead8a1}
</style></head><body>
<header><div class="logo">Sgrovio</div><button id="logoutBtn" class="logout" style="display:none">Esci</button></header>
<div class="container">
<section id="login" class="card"><h1>Area Professionista</h1><p class="muted">Accedi per visualizzare le richieste compatibili con la tua attività.</p><label>Email</label><input id="email" type="email" placeholder="nome@azienda.it"><label>Password</label><input id="password" type="password" placeholder="Password"><button id="loginBtn" class="primary">Accedi</button><div id="loginMessage" class="error"></div></section>
<section id="dashboard"><div class="card"><h1 id="welcome">Dashboard</h1><p class="muted">Gestisci qui le richieste che Sgrovio ha associato alla tua attività.</p><div id="ratingSummary"></div><div class="tabs"><button class="tab active" data-filter="proposto">Nuove <span id="count-proposto" class="badge">0</span></button><button class="tab" data-filter="accettato">Accettate <span id="count-accettato" class="badge">0</span></button><button class="tab" data-filter="in_attesa_conferma_cliente">Da confermare <span id="count-in_attesa_conferma_cliente" class="badge">0</span></button><button class="tab" data-filter="problema_segnalato">Problemi <span id="count-problema_segnalato" class="badge">0</span></button><button class="tab" data-filter="completata">Completate <span id="count-completata" class="badge">0</span></button><button class="tab" data-filter="rifiutato">Rifiutate <span id="count-rifiutato" class="badge">0</span></button><button class="tab" data-filter="tutte">Tutte <span id="count-tutte" class="badge">0</span></button></div></div><div id="requests"></div></section>
</div>
<script>
const SUPABASE_URL='https://nijsfyysxvqogjjfawrc.supabase.co';
const SUPABASE_KEY='sb_publishable_YBMEKwWJCtTZsiRBS45hGQ_sDogz1SE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginSection=document.getElementById('login'),dashboard=document.getElementById('dashboard'),logoutBtn=document.getElementById('logoutBtn'),requests=document.getElementById('requests'),loginMessage=document.getElementById('loginMessage');
let allRequests=[],currentFilter='proposto',currentProfessionista=null,professionalReviews=[];
document.getElementById('loginBtn').onclick=login;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRequests();});
logoutBtn.onclick=async()=>{await db.auth.signOut();showLogin();};

async function login(){loginMessage.textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const{error}=await db.auth.signInWithPassword({email,password});if(error){loginMessage.textContent='Accesso non riuscito: '+error.message;return}await startDashboard()}

async function startDashboard(){const{data:{user}}=await db.auth.getUser();if(!user){showLogin();return}const{data:professionista,error}=await db.from('professionisti').select('id,nome,email').eq('user_id',user.id).single();if(error||!professionista){await db.auth.signOut();showLogin(false);loginMessage.textContent=error?'Errore database: '+error.message:'Questo account non è collegato a un professionista Sgrovio.';return}currentProfessionista=professionista;loginSection.style.display='none';dashboard.style.display='block';logoutBtn.style.display='block';document.getElementById('welcome').textContent='Ciao, '+professionista.nome;await loadReviews();await loadRequests()}

function stars(v){const n=Math.max(0,Math.min(5,Math.round(Number(v)||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}
function fmtDate(v){try{return new Intl.DateTimeFormat('it-IT',{dateStyle:'medium'}).format(new Date(v));}catch{return''}}

async function loadReviews(){
  const box=document.getElementById('ratingSummary');
  if(!currentProfessionista){box.innerHTML='';return;}
  const{data,error}=await db.from('recensioni').select('voto,commento,created_at').eq('professionista_id',currentProfessionista.id).order('created_at',{ascending:false});
  if(error){professionalReviews=[];box.innerHTML='';return;}
  professionalReviews=data||[];
  if(!professionalReviews.length){box.innerHTML='<div class="ratingBox"><strong>Reputazione Sgrovio</strong><p class="muted" style="margin:6px 0 0">Non hai ancora ricevuto recensioni.</p></div>';return;}
  const avg=professionalReviews.reduce((s,r)=>s+Number(r.voto||0),0)/professionalReviews.length;
  const recent=professionalReviews.filter(r=>r.commento).slice(0,3).map(r=>`<div class="reviewItem"><div class="stars">${stars(r.voto)}</div><div>${escapeHtml(r.commento)}</div><span class="muted" style="font-size:12px">${escapeHtml(fmtDate(r.created_at))}</span></div>`).join('');
  box.innerHTML=`<div class="ratingBox"><strong>Reputazione Sgrovio</strong><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px"><span class="stars">${stars(avg)}</span><strong>${avg.toFixed(1)}/5</strong><span class="muted">${professionalReviews.length} ${professionalReviews.length===1?'recensione':'recensioni'}</span></div>${recent}</div>`;
}

async function loadRequestStatuses(){for(const item of allRequests){if(item.stato!=='accettato')continue;const{data,error}=await db.rpc('stato_richiesta_professionista',{p_matching_id:item.matching_id});if(!error)item.richiesta_stato=data||null;}}

async function loadRequests(){requests.innerHTML='<div class="card">Caricamento richieste...</div>';const{data,error}=await db.from('richieste_professionista').select('*').order('created_at',{ascending:false});if(error){requests.innerHTML='<div class="card error">Errore: '+escapeHtml(error.message)+'</div>';return}allRequests=data||[];await loadRequestStatuses();updateCounts();renderRequests()}

function updateCounts(){
  document.getElementById('count-proposto').textContent=allRequests.filter(x=>x.stato==='proposto').length;
  document.getElementById('count-accettato').textContent=allRequests.filter(x=>x.stato==='accettato'&&!['in_attesa_conferma_cliente','problema_segnalato','completata'].includes(x.richiesta_stato)).length;
  document.getElementById('count-in_attesa_conferma_cliente').textContent=allRequests.filter(x=>x.richiesta_stato==='in_attesa_conferma_cliente').length;
  document.getElementById('count-problema_segnalato').textContent=allRequests.filter(x=>x.richiesta_stato==='problema_segnalato').length;
  document.getElementById('count-completata').textContent=allRequests.filter(x=>x.richiesta_stato==='completata').length;
  document.getElementById('count-rifiutato').textContent=allRequests.filter(x=>x.stato==='rifiutato').length;
  document.getElementById('count-tutte').textContent=allRequests.length;
}

function filtered(){
  if(currentFilter==='tutte')return allRequests;
  if(currentFilter==='completata')return allRequests.filter(x=>x.richiesta_stato==='completata');
  if(currentFilter==='in_attesa_conferma_cliente')return allRequests.filter(x=>x.richiesta_stato==='in_attesa_conferma_cliente');
  if(currentFilter==='problema_segnalato')return allRequests.filter(x=>x.richiesta_stato==='problema_segnalato');
  if(currentFilter==='accettato')return allRequests.filter(x=>x.stato==='accettato'&&!['in_attesa_conferma_cliente','problema_segnalato','completata'].includes(x.richiesta_stato));
  return allRequests.filter(x=>x.stato===currentFilter);
}

function renderRequests(){
  const data=filtered();
  if(!data.length){requests.innerHTML='<div class="card empty">Nessuna richiesta in questa sezione.</div>';return}
  requests.innerHTML='';
  data.forEach(match=>{
    const card=document.createElement('div');card.className='card';
    const accepted=match.stato==='accettato';
    const completed=match.richiesta_stato==='completata';
    const awaiting=match.richiesta_stato==='in_attesa_conferma_cliente';
    const problem=match.richiesta_stato==='problema_segnalato';
    const assignedElsewhere=match.stato==='assegnato_altro';
    const tel=String(match.telefono||'').replace(/[^0-9+]/g,'');
    const email=String(match.email||'');
    const contacts=accepted?`<div class="contactBox"><strong>Contatti cliente</strong><p><strong>Nome:</strong> ${escapeHtml(match.nome_cliente||'Non indicato')}</p><p><strong>Email:</strong> ${escapeHtml(email||'Non indicata')}</p><p><strong>Telefono:</strong> ${escapeHtml(match.telefono||'Non indicato')}</p>${tel?`<a class="contact" href="tel:${escapeHtml(tel)}">Chiama</a><a class="contact" target="_blank" rel="noopener" href="https://wa.me/${escapeHtml(tel.replace(/^\+/,'').replace(/\s/g,''))}">WhatsApp</a>`:''}${email?`<a class="contact" href="mailto:${escapeHtml(email)}">Email</a>`:''}</div>`:'';
    const statusBadge=completed?'<span class="done">✓ Completata</span>':awaiting?'<span class="waiting">⏳ In attesa del cliente</span>':problem?'<span class="problem">⚠ Problema segnalato</span>':assignedElsewhere?'<span class="assigned">Assegnata ad altro professionista</span>':`<span class="score">Compatibilità ${escapeHtml(match.punteggio||0)}%</span>`;
    const statusText=completed?'Lavoro completato e confermato dal cliente':awaiting?'Lavoro indicato come eseguito. In attesa della conferma del cliente':problem?'Il cliente ha segnalato che il lavoro non può ancora essere chiuso':assignedElsewhere?'Un altro professionista ha accettato prima questa richiesta':escapeHtml(match.stato||'');
    const action=accepted&&!completed&&!awaiting?`<button class="complete" onclick="markJobDone('${match.matching_id}')">${problem?'PROBLEMA RISOLTO - LAVORO ESEGUITO':'LAVORO ESEGUITO'}</button>`:'';
    card.innerHTML=`${statusBadge}<h2>${escapeHtml(match.categoria||'Richiesta')}</h2><p><strong>Zona:</strong> ${escapeHtml(match.comune||'')} ${match.cap?'('+escapeHtml(match.cap)+')':''}</p><p><strong>Descrizione:</strong><br>${escapeHtml(match.descrizione||'')}</p><p><strong>Urgenza:</strong> ${escapeHtml(match.urgenza||'Non indicata')}</p><p><strong>Budget:</strong> ${escapeHtml(match.budget||'Non indicato')}</p><p><strong>Stato:</strong> ${statusText}</p>${contacts}${match.stato==='proposto'?`<div style="margin-top:16px"><button class="accept" onclick="respond('${match.matching_id}','accettato')">ACCETTA</button><button class="reject" onclick="respond('${match.matching_id}','rifiutato')">RIFIUTA</button></div>`:''}${awaiting?'<p class="muted" style="margin-top:14px">Non devi fare altro: il cliente deve confermare il completamento.</p>':''}${completed?'<p class="muted" style="margin-top:14px">Se il cliente lascia una recensione, la vedrai nella sezione Reputazione Sgrovio in alto.</p>':''}${action}`;
    requests.appendChild(card);
  });
}

async function respond(matchId,stato){
  if(!confirm(stato==='accettato'?'Vuoi accettare questa richiesta? Se un altro professionista l’ha già presa, non potrai più accettarla.':'Vuoi rifiutare questa richiesta?'))return;
  const{error}=await db.rpc('rispondi_matching_professionista',{p_matching_id:matchId,p_azione:stato});
  if(error){
    const msg=String(error.message||error);
    if(msg.toLowerCase().includes('assegnat')) alert('Questa richiesta è già stata assegnata a un altro professionista.');
    else alert('Errore: '+msg);
    await loadRequests();
    return;
  }
  currentFilter=stato;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===currentFilter));
  await loadRequests();
}

async function markJobDone(matchId){
  if(!confirm('Confermi di aver eseguito il lavoro? Il cliente dovrà poi confermare il completamento.'))return;
  const{error}=await db.rpc('segnala_lavoro_eseguito_professionista',{p_matching_id:matchId});
  if(error){alert('Errore: '+error.message);return}
  currentFilter='in_attesa_conferma_cliente';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===currentFilter));
  await loadRequests();
}
window.markJobDone=markJobDone;

function showLogin(clear=true){dashboard.style.display='none';logoutBtn.style.display='none';loginSection.style.display='block';if(clear)loginMessage.textContent=''}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
(async()=>{const{data:{session}}=await db.auth.getSession();if(session)await startDashboard()})();
</script></body></html>
