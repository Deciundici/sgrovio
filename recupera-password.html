<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recupera password | Sgrovio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#171717;font:16px system-ui,Arial,sans-serif}header{background:#fff;border-bottom:1px solid #e4dfd6;padding:20px}header a{color:inherit;text-decoration:none;font-size:25px;font-weight:900}.wrap{max-width:510px;margin:55px auto;padding:0 18px}.card{background:white;border:1px solid #e4dfd6;border-radius:18px;padding:28px;box-shadow:0 5px 20px #0001}h1{margin-top:0;font-size:27px}p{color:#686868;line-height:1.5}label{display:block;font-weight:700;margin-top:18px}input{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #bbb;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:14px;background:#171717;color:white;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6}a{color:#171717}#message{margin-top:18px;white-space:pre-wrap}#message.error{color:#9b1c1c}#message.ok{color:#176735}.back{display:block;margin-top:20px;text-align:center;font-weight:700}</style></head>
<body><header><a href="./">Sgrovio</a></header><main class="wrap"><section class="card">
<div id="request"><h1>Hai dimenticato la password?</h1><p>Inserisci l'email del tuo account Sgrovio. Se è registrata, riceverai un link per scegliere una nuova password.</p><form id="requestForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="nome@email.it"></label><button type="submit">Invia link di recupero</button></form></div>
<div id="reset" hidden><h1>Scegli una nuova password</h1><p>Inserisci una nuova password di almeno 8 caratteri.</p><form id="resetForm"><label>Nuova password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Conferma password<input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Salva nuova password</button></form></div>
<p id="message" role="status" aria-live="polite"></p><a class="back" href="cliente.html">Torna all'Area Cliente</a><a class="back" href="professionista.html">Torna all'Area Professionista</a>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://nijsfyysxvqogjjfawrc.supabase.co','sb_publishable_YBMEKwWJCtTZsiRBS45hGQ_sDogz1SE');
const message=document.getElementById('message');
function notify(s,ok=true){message.textContent=s;message.className=ok?'ok':'error'}
function showReset(){document.getElementById('request').hidden=true;document.getElementById('reset').hidden=false}
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showReset()});
(async()=>{const params=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));if(params.get('error')||hash.get('error'))notify('Link non valido o scaduto. Richiedi un nuovo link.',false);if(params.get('code')){const{error}=await db.auth.exchangeCodeForSession(params.get('code'));if(error)notify('Link non valido o scaduto. Richiedi un nuovo link.',false);else showReset()}else if(hash.get('type')==='recovery'){const{data}=await db.auth.getSession();if(data.session)showReset()}})();
document.getElementById('requestForm').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;notify('Invio in corso…');try{const{error}=await db.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+'/recupera-password.html'});if(error)throw error;notify('Se questa email è registrata, riceverai un link per reimpostare la password. Controlla anche la cartella spam.')}catch(err){notify('Impossibile inviare il link in questo momento. Riprova tra qualche minuto.',false)}finally{button.disabled=false}});
document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const pass=document.getElementById('password').value;if(pass!==document.getElementById('confirm').value){notify('Le password non coincidono.',false);return}const button=e.target.querySelector('button');button.disabled=true;try{const{data:{session}}=await db.auth.getSession();if(!session){notify('Link scaduto. Richiedi un nuovo link.',false);return}const{error}=await db.auth.updateUser({password:pass});if(error)throw error;await db.auth.signOut();e.target.hidden=true;notify('Password aggiornata! Ora puoi accedere con la nuova password.')}catch(err){notify('Non è stato possibile aggiornare la password. Richiedi un nuovo link.',false)}finally{button.disabled=false}});
</script></body></html>
